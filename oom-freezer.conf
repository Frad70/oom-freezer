# oom-freezer configuration.
# Parsed as KEY=value without executing shell code. Keep it declarative.

# ---- global ----
FREEZE_DRYRUN=1              # 1 = log only, take no action
FREEZE_INTERVAL_S=15         # seconds between main loop ticks
FREEZE_AUTOPILOT=1           # 1 = take reversible actions automatically

# ---- freeze: idle background processes ----
FREEZE_ENABLE=1
FREEZE_MONITOR=0
FREEZE_POLL_S=60
FREEZE_MIN_UPTIME_MIN=60
FREEZE_IDLE_MIN=30
FREEZE_CPU_IDLE_PCT=12
FREEZE_MIN_RSS_MB=128
FREEZE_BIG_JAVA_MB=1024
FREEZE_JAVA_BIG=0
FREEZE_GRADLE=1
# Extra substrings of commands or paths to watch, and exclusions, comma-separated.
FREEZE_WATCH=
FREEZE_EXCLUDE=
FREEZE_NEVER=
# Game server jars: java processes started from a jar whose file name begins
# with one of these prefixes (case-insensitive), or whose command line contains
# one of the FREEZE_SERVER_MAIN class names, are candidates of kind game-server.
# Example for Minecraft servers:
#   FREEZE_SERVER_JARS=paper,purpur,folia,spigot,fabric-server,forge,velocity,server
#   FREEZE_SERVER_MAIN=io.papermc.paperclip,net.minecraft.server.Main
FREEZE_SERVER_JARS=server
FREEZE_SERVER_MAIN=
FREEZE_RECLAIM_MB=256
FREEZE_RECLAIM_MAX_S=60
