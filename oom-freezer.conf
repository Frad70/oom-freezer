# oom-freezer configuration.
# Parsed as KEY=value without executing shell code. Keep it declarative.
# Unknown keys are logged and ignored. Reload with: systemctl reload oom-freezer

# ---- mode ----
# 1 = dry-run: decide and log "dry-run: would freeze ..." but touch nothing.
# Watch journalctl -t oom-freezer and /run/oom-freezer/freeze.state first,
# then set 0 to act.
FREEZE_DRYRUN=1
FREEZE_ENABLE=1
FREEZE_INTERVAL_S=15         # seconds between main loop ticks
FREEZE_POLL_S=60             # seconds between /proc scans

# ---- when a process counts as idle ----
FREEZE_MIN_UPTIME_MIN=60     # process age before it may be frozen
FREEZE_IDLE_MIN=30           # minutes of CPU below the threshold
FREEZE_CPU_IDLE_PCT=12       # percent of one core
FREEZE_MIN_RSS_MB=128        # smaller processes are ignored
FREEZE_BIG_JAVA_MB=1024      # a java process this large is a java-big candidate
FREEZE_JAVA_BIG=0            # 1 = freeze java-big candidates too (opt in)
FREEZE_GRADLE=1              # 1 = send SIGTERM to idle Gradle daemons (they are never frozen)

# ---- what is a candidate ----
# Substrings of the command line, working directory or executable path
# (case-insensitive) that make any process a candidate of kind watched.
#   FREEZE_WATCH=my-test-server,/srv/staging
FREEZE_WATCH=
# Game server jars: java processes started from a jar whose file name begins
# with one of these prefixes (case-insensitive), or whose command line contains
# one of the FREEZE_SERVER_MAIN class names, are candidates of kind game-server.
# Example for Minecraft servers:
#   FREEZE_SERVER_JARS=paper,purpur,folia,spigot,fabric-server,forge,velocity,server
#   FREEZE_SERVER_MAIN=io.papermc.paperclip,net.minecraft.server.Main
FREEZE_SERVER_JARS=server
FREEZE_SERVER_MAIN=

# ---- exemptions ----
# All three match substrings of the command line, working directory or
# executable path, case-insensitive, comma-separated, at most 16 entries.
# FREEZE_EXCLUDE: never frozen automatically, still listed in freeze.state as
#   excluded:<entry>. A manual "oom-freezer freeze <pid>" still works.
# FREEZE_NEVER: never frozen, not even manually; listed as never:<entry>.
# FREEZE_IGNORE: not even evaluated or listed.
#   FREEZE_EXCLUDE=/srv/production
#   FREEZE_NEVER=launcher,ide
#   FREEZE_IGNORE=my-benchmark
FREEZE_EXCLUDE=
FREEZE_NEVER=
FREEZE_IGNORE=
# Exact process names (comm) that are protected together with every descendant
# up to the next shell or session boundary. Replaces the built in default
# (systemd, init, sshd, dbus-daemon, pipewire, wireplumber, Xorg, Xwayland,
# gnome-shell, kwin_wayland, sway, weston) when set.
# Do not put a comment on the same line as a list value.
#   FREEZE_PROTECT=systemd,sshd,pipewire,wireplumber,my-compositor
FREEZE_PROTECT=systemd,init,sshd,dbus-daemon,pipewire,wireplumber,Xorg,Xwayland,gnome-shell,kwin_wayland,sway,weston

# ---- activity check ----
# An absolute path to a program run as
#   <cmd> <pid> <kind> <name>
# just before a process would be frozen. Exit 1 permits the freeze. Exit 0 means
# the process is in use (for example players are connected) and resets its idle
# timer. Any other result, a timeout or a missing program also blocks the freeze.
# No shell is involved. At most one check runs per poll.
#   FREEZE_ACTIVE_CMD=/usr/local/libexec/server-has-players
FREEZE_ACTIVE_CMD=
FREEZE_ACTIVE_TIMEOUT_S=10

# ---- reclaim after the freeze ----
FREEZE_RECLAIM_MB=256        # chunk size written to memory.reclaim
FREEZE_RECLAIM_MAX_S=60      # time budget for reclaim
